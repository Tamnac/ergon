[package]
name = "ergon-desktop"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "ergon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"
