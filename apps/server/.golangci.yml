version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (io/fs.File).Close
        - (io.ReadCloser).Close

formatters:
  enable:
    - gofmt
    - goimports
